schema: spec-driven

context: |
  # Project

  Project Name: MediNote

  MediNote is an AI-powered medical practice management system built as a REST API with Laravel 13.

  The purpose of the application is to reduce physicians' administrative workload by automatically converting free-text consultation notes into structured medical records using AI.

  AI never replaces the physician.
  Every AI-generated consultation must always be reviewed, edited if necessary, and validated by the physician before being persisted.

  --------------------------------------------------
  TECHNOLOGY STACK
  --------------------------------------------------

  Backend
  - Laravel 13
  - PHP 8.3
  - MySQL
  - Laravel Sanctum
  - Laravel AI SDK
  - Laravel Jobs & Queues
  - Scribe
  - OpenSpec
  - Laravel Boost
  - Git & GitHub

  Frontend
  - React JS
  - JavaScript (NOT TypeScript)
  - Tailwind CSS
  - Axios
  - React Router

  Architecture
  - MVC
  - REST API
  - Service Layer
  - API Resources
  - Form Requests
  - Dependency Injection

  --------------------------------------------------
  USER ROLES
  --------------------------------------------------

  Assistant
  - Manage patients
  - Manage appointments
  - View dashboard

  Doctor
  - Full access
  - Manage patients
  - Manage appointments
  - Start consultations
  - Write consultation notes
  - Validate AI results
  - View consultation history
  - Export consultations

  --------------------------------------------------
  DATABASE MODEL
  --------------------------------------------------

  User

      1 ---- N

  Patient

      1 ---- N

  Appointment

      1 ---- 1

  TextBrut

      1 ---- 1

  Consultation

      1 ---- N

  Prescription

  TextBrut stores only the physician's original free-text consultation note.

  Consultation stores only validated structured medical information generated by AI.

  Prescription stores structured medications extracted from the consultation.

  --------------------------------------------------
  MAIN BUSINESS FLOW
  --------------------------------------------------

  Assistant or doctor creates a patient.

  Assistant or doctor creates an appointment.

  Doctor starts a consultation from an appointment.

  Doctor writes a free-text consultation note.

  The note is stored in TextBrut.

  The AI analyzes the TextBrut asynchronously.

  The AI generates a structured consultation.

  The physician reviews the generated information.

  The physician edits data if necessary.

  The physician validates the consultation.

  Only validated consultations are stored permanently.

  --------------------------------------------------
  AI ARCHITECTURE
  --------------------------------------------------

  Laravel AI SDK is mandatory.

  AI Agent uses Laravel Tools.

  Available tools:

  - getPatientHistory(patientId)
  - getCurrentMedications(patientId)
  - getPatientAllergies(patientId)
  - saveStructuredConsultation(consultation)

  Conversation Memory must be enabled.

  Memory is limited to the current AI conversation.

  Memory never replaces the patient's permanent medical history.

  AI responses must always follow the Structured Output schema.

  Expected JSON:

  {
    "motif": "string",
    "symptomes": [
      "string"
    ],
    "observations": "string",
    "diagnostic": "string | null",
    "prescriptions": [
      {
        "medicament": "string",
        "dosage": "string | null",
        "frequence": "string | null",
        "duree": "string | null"
      }
    ],
    "suivi": {
      "date": "YYYY-MM-DD | null",
      "commentaire": "string | null"
    },
    "resume": "string"
  }

  AI must always return valid JSON.

  Never return Markdown.

  Never return explanations.

  Never save AI output automatically.

  --------------------------------------------------
  DEVELOPMENT RULES
  --------------------------------------------------

  Every feature MUST start with an OpenSpec specification.

  Follow Specification-Driven Development.

  Never implement code before the specification exists.

  Controllers must remain thin.

  Business logic belongs in Services.

  AI logic belongs in Agents, Actions, Jobs and Tools.

  Validation must use Form Requests.

  Responses must use API Resources.

  Authentication must use Laravel Sanctum.

  Long-running AI requests must use Jobs and Queues.

  Centralize exception handling.

  Follow Laravel best practices.

  --------------------------------------------------
  DOCUMENTATION
  --------------------------------------------------

  Every endpoint must be documented with Scribe.

  PHPDoc annotations are required.

  A Postman collection must be maintained.

rules:

  proposal:
    - Keep proposals concise and focused on a single feature.
    - Always explain the business value.
    - Always include acceptance criteria.
    - Always mention affected database tables.
    - Mention API endpoints if applicable.

  tasks:
    - Tasks should follow Laravel best practices.
    - Break work into small implementation steps.
    - Database before Models.
    - Models before Services.
    - Services before Controllers.
    - Controllers before Resources.
    - Resources before Documentation.
    - AI features must include Jobs.
    - AI features must include Structured Output.
    - AI features must include validation.
    - AI features must include tests when possible.

  spec:
    - Use clear functional requirements.
    - Define actors.
    - Define business rules.
    - Define validation rules.
    - Define API endpoints.
    - Define request and response examples.
    - Mention authorization requirements.
    - Mention database impact.
    - Mention AI behavior when applicable.

  database:
    - Never modify Eloquent relationships, foreign keys, model associations, or database schema unless I explicitly request it.
    - Treat all existing relationships as locked.
    - If you think a relationship should be changed or improved, DO NOT implement the change.
    - First enter Plan Mode and explain:
      - what you want to change,
      - why you recommend it,
      - what impact it has,
      - then wait for my approval.
    - Do not generate or apply migrations that modify relationships without my confirmation.